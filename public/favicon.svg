<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- The background is inherently transparent in SVG when no background shape is defined -->
  <g fill="none" stroke-linecap="round">
    <!-- Orbital Rings -->
    <ellipse cx="256" cy="256" rx="210" ry="75" transform="rotate(35 256 256)" stroke="#4b5563" stroke-width="32"/>
    <ellipse cx="256" cy="256" rx="190" ry="65" transform="rotate(-40 256 256)" stroke="#8f8c7b" stroke-width="28"/>
    <ellipse cx="256" cy="256" rx="180" ry="90" transform="rotate(-85 256 256)" stroke="#6b7280" stroke-width="22"/>

    <!-- Intersecting Spikes -->
    <path d="M40 300 Q 256 220 470 110" stroke="#d1d5db" stroke-width="18"/>
    <path d="M350 40 Q 256 256 330 470" stroke="#d1d5db" stroke-width="18"/>
  </g>
</svg>
